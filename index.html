<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d9c7d8" />
  <title>Until October 12</title>

  <style>
    :root {
      --ink: #5d5661;
      --muted: #817983;
      --glass: rgba(255,255,255,.42);
      --border: rgba(255,255,255,.62);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255,255,255,.72),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 25%,
          rgba(242,210,220,.72),
          transparent 32%
        ),
        radial-gradient(
          circle at 25% 85%,
          rgba(202,222,218,.72),
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #d9cfe0 0%,
          #f1ddd7 48%,
          #d7e4dc 100%
        );

      display: grid;
      place-items: center;
    }

    /* Background */

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(50px);
      opacity: .48;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 260px;
      height: 260px;
      background: #e8bfd0;
      top: -70px;
      left: -70px;
    }

    .orb.two {
      width: 330px;
      height: 330px;
      background: #c6ddd8;
      right: -120px;
      bottom: -100px;
      animation-delay: -5s;
    }

    .orb.three {
      width: 180px;
      height: 180px;
      background: #e8d8b7;
      right: 18%;
      top: 8%;
      animation-delay: -9s;
    }

    @keyframes drift {
      to {
        transform: translate(28px, -18px) scale(1.08);
      }
    }

    /* Main card */

    .card {
      position: relative;
      width: min(900px, calc(100vw - 32px));

      padding:
        clamp(38px, 7vw, 72px)
        clamp(22px, 6vw, 70px);

      border: 1px solid var(--border);
      border-radius: 34px;

      background: var(--glass);

      box-shadow:
        0 30px 90px rgba(82,66,82,.14),
        inset 0 1px 0 rgba(255,255,255,.6);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(34px, 7vw, 64px);
      letter-spacing: -.035em;
    }

    .date {
      margin: 12px 0 38px;
      color: var(--muted);
      font-size: 15px;
    }

    /* Timer */

    .timer {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: clamp(8px, 2.2vw, 20px);
    }

    .unit {
      min-width: clamp(62px, 11vw, 118px);
    }

    .number {
      font-variant-numeric: tabular-nums;
      font-size: clamp(42px, 8vw, 82px);
      line-height: 1;
      font-weight: 650;
      letter-spacing: -.055em;
    }

    .label {
      margin-top: 9px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .colon {
      color: rgba(93,86,97,.45);
      font-size: clamp(30px, 6vw, 58px);
    }

    .note {
      margin: 38px auto 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

   
    @media (max-width: 520px) {
      .card {
        border-radius: 26px;
      }

      .timer {
        gap: 5px;
      }

      .unit {
        min-width: 57px;
      }

      .note {
        margin-top: 30px;
      }

      #youtubePlayer {
        right: 15px;
        bottom: 65px;
        width: calc(100vw - 30px);
      }

  
    }
  </style>
</head>

<body>

  <!-- Background -->
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <!-- Countdown -->
  <main class="card">

    <p class="eyebrow">counting down to</p>

    <h1>October 12, 2026</h1>

    <p class="date">
      18:35 · Astana time
    </p>

    <section
      class="timer"
      aria-label="Countdown"
    >

      <div class="unit">
        <div class="number" id="days">000</div>
        <div class="label">days</div>
      </div>

      <div class="colon">:</div>

      <div class="unit">
        <div class="number" id="hours">00</div>
        <div class="label">hours</div>
      </div>

      <div class="colon">:</div>

      <div class="unit">
        <div class="number" id="minutes">00</div>
        <div class="label">minutes</div>
      </div>

      <div class="colon">:</div>

      <div class="unit">
        <div class="number" id="seconds">00</div>
        <div class="label">seconds</div>
      </div>

    </section>

    <p class="note" id="status">
      A little time left. Take a breath.
    </p>

  </main>






  <script>

    /* =========================================
       COUNTDOWN
       ========================================= */

    // October 12, 2026 at 18:35 in Astana.
    // Astana = UTC+05:00.
    const target =
      new Date('2026-10-12T18:35:00+05:00').getTime();

    const $ = id =>
      document.getElementById(id);


    function pad(number, length = 2) {
      return String(number).padStart(length, '0');
    }


    function tick() {

      const diff =
        Math.max(0, target - Date.now());

      const total =
        Math.floor(diff / 1000);

      const days =
        Math.floor(total / 86400);

      const hours =
        Math.floor(
          (total % 86400) / 3600
        );

      const minutes =
        Math.floor(
          (total % 3600) / 60
        );

      const seconds =
        total % 60;


      $('days').textContent =
        pad(days, 3);

      $('hours').textContent =
        pad(hours);

      $('minutes').textContent =
        pad(minutes);

      $('seconds').textContent =
        pad(seconds);


      if (diff === 0) {
        $('status').textContent =
          'The moment has arrived.';
      }
    }


    tick();

    setInterval(tick, 250);


 

  </script>

</body>
</html>
